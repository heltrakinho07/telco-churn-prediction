name: CI

# Corre a cada push e em cada Pull Request para a branch main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      # 1) Obter o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2) Preparar o Python
      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3) Instalar dependências (mínimas) + pytest
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # 4) Correr a bateria de testes
      - name: Correr testes
        run: pytest tests/ -v
